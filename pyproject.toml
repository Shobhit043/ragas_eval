[project]
name = "ragas-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.5.9",
    "instructor==1.17.0",
    "langchain-community==0.3.31",
    "langchain-text-splitters==1.1.3",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "openai==3.3.0",
    "pandas==3.1.0",
    "pypdf==6.21.2",
    "python-dotenv==1.2.4",
    "ragas==0.4.3",
    "sentence-transformers==6.2.0",
    "streamlit==1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:The EmbeddingFunction class does not implement build_from_config.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["models/checkpoints", "db/chroma_db", "plots"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
